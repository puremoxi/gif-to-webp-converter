<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GIF to WebP Converter</title>
    <!-- 1. Load Tailwind CSS for styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- 2. Load the FFmpeg library (umd builds) -->
    <!-- These are required for the conversion logic -->
    <script src="https://unpkg.com/@ffmpeg/ffmpeg@0.12.10/dist/umd/ffmpeg.js"></script>
    <script src="https://unpkg.com/@ffmpeg/util@0.12.1/dist/umd/util.js"></script>
    
    <style>
        /* Custom styles */
        body {
            font-family: 'Inter', sans-serif;
        }
        .dropzone-active {
            border-color: #2563eb; /* blue-600 */
            background-color: #1e3a8a; /* blue-900 */
        }
        /* Simple keyframe animations for status */
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }
        .status-processing {
            animation: pulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
        }
    </style>
    <!-- Load Inter font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body class="bg-gray-900 text-gray-200 min-h-screen p-4 md:p-8">

    <div class="max-w-5xl mx-auto">
        <header class="text-center mb-8">
            <h1 class="text-3xl md:text-4xl font-bold text-white mb-2">GIF to WebP Converter</h1>
            <p class="text-lg text-gray-400">Convert animated GIFs to high-quality WebP files locally.</p>
            <p class="text-sm text-gray-500">Your files are processed 100% on your machine and never uploaded.</p>
        </header>

        <main>
            <!-- File Dropzone -->
            <div id="dropzone" class="border-4 border-dashed border-gray-700 rounded-lg p-8 md:p-16 text-center cursor-pointer transition-all duration-300 hover:border-gray-500">
                <input type="file" id="fileInput" multiple accept="image/gif" class="hidden">
                <svg class="w-16 h-16 mx-auto text-gray-500 mb-4" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M3 16.5v2.25A2.25 2.25 0 005.25 21h13.5A2.25 2.25 0 0021 18.75V16.5m-13.5-9L12 3m0 0l4.5 4.5M12 3v13.5" />
                </svg>
                <p class="text-xl font-medium text-white">Drag & drop your .gif files here</p>
                <p class="text-gray-400">or click to select files</p>
                <p id="converter-status" class="mt-4 text-yellow-400 font-medium"></p>
                <!-- New Progress Bar -->
                <div id="load-progress-container" class="w-full max-w-md mx-auto mt-4 hidden">
                    <div class="w-full bg-gray-700 rounded-full h-2.5">
                        <div id="load-progress-bar" class="bg-blue-600 h-2.5 rounded-full" style="width: 0%"></div>
                    </div>
                </div>
            </div>

            <!-- Control Buttons -->
            <div class="flex flex-col sm:flex-row justify-center gap-4 my-6">
                <button id="start-button" disabled class="bg-blue-600 text-white font-semibold py-3 px-8 rounded-lg shadow-md hover:bg-blue-700 transition-all duration-200 disabled:opacity-50 disabled:cursor-not-allowed">
                    Start Conversion
                </button>
                <button id="clear-button" class="bg-gray-700 text-gray-300 font-semibold py-3 px-8 rounded-lg hover:bg-gray-600 transition-all duration-200 disabled:opacity-50">
                    Clear Queue
                </button>
            </div>

            <!-- File Queue / Render List -->
            <div id="file-list" class="space-y-4">
                <!-- File items will be injected here by JavaScript -->
            </div>
        </main>
    </div>

    <!-- 3. The Application Logic -->
    <script>
        // Defer access to globals until we're sure they've loaded
        let FFmpeg, fetchFile;

        // DOM Elements
        const dropzone = document.getElementById('dropzone');
        const fileInput = document.getElementById('fileInput');
        const startButton = document.getElementById('start-button');
        const clearButton = document.getElementById('clear-button');
        const fileList = document.getElementById('file-list');
        const converterStatus = document.getElementById('converter-status');
        // New progress bar elements
        const loadProgressContainer = document.getElementById('load-progress-container');
        const loadProgressBar = document.getElementById('load-progress-bar');

        // App State
        let ffmpeg = null;
        let fileQueue = []; // Array to hold file objects { id, file, status, original, converted }
        let isProcessing = false;

        // --- Core Functions ---

        /**
         * Loads the FFmpeg instance. This is a one-time setup.
         */
        async function loadFFmpeg() {
            converterStatus.textContent = 'Loading converter engine (this may take a moment)...';
            loadProgressContainer.classList.remove('hidden'); // Show progress bar container

            // Check if globals are loaded
            if (typeof window.FFmpeg === 'undefined' || typeof window.FFmpegUtil === 'undefined') {
                console.error('FFmpeg libraries not loaded.');
                converterStatus.textContent = 'Error: Failed to load external converter libraries. This might be due to a network issue or content blocking. Please refresh or try a different browser.';
                return;
            }

            // Assign globals now that we've checked
            FFmpeg = window.FFmpeg.FFmpeg;
            fetchFile = window.FFmpegUtil.fetchFile;
            
            // Check if the destructured parts are valid
            if (typeof FFmpeg === 'undefined' || typeof fetchFile === 'undefined') {
                 console.error('FFmpeg libraries loaded, but exports are missing.');
                 converterStatus.textContent = 'Error: Converter libraries loaded incorrectly. Please refresh.';
                 return;
            }
            
            try {
                ffmpeg = new FFmpeg();
                ffmpeg.on('log', ({ message }) => {
                    // You can log FFMPEG output here if needed
                    // console.log(message);
                });
                
                // Path to the core WASM/JS file
                const coreURL = 'https://unpkg.com/@ffmpeg/core@0.12.6/dist/umd/ffmpeg-core.js';
                
                // --- Custom Fetch with Progress ---
                converterStatus.textContent = 'Downloading converter engine...';
                const response = await fetch(coreURL);

                if (!response.ok) {
                    throw new Error(`Failed to fetch FFmpeg core: ${response.statusText}`);
                }

                const contentLength = response.headers.get('content-length');
                if (!contentLength || !response.body) {
                    // Fallback for servers that don't send content-length or for older browsers
                    console.warn('Cannot track download progress. Loading normally.');
                    await ffmpeg.load({ coreURL });
                } else {
                    const totalSize = parseInt(contentLength, 10);
                    let loadedSize = 0;
                    const reader = response.body.getReader();
                    const chunks = [];

                    while (true) {
                        const { done, value } = await reader.read();
                        if (done) {
                            break;
                        }
                        chunks.push(value);
                        loadedSize += value.length;
                        const progress = (loadedSize / totalSize) * 100;
                        loadProgressBar.style.width = `${progress.toFixed(0)}%`;
                    }
                    
                    converterStatus.textContent = 'Initializing converter...';
                    loadProgressBar.style.width = `100%`;

                    const blob = new Blob(chunks);
                    const blobUrl = URL.createObjectURL(blob);
                    
                    await ffmpeg.load({ coreURL: blobUrl });

                    URL.revokeObjectURL(blobUrl); // Clean up
                }
                // --- End Custom Fetch ---
                
                converterStatus.textContent = 'Converter ready. Please add files.';
                console.log('FFmpeg loaded successfully.');
                loadProgressContainer.classList.add('hidden'); // Hide progress bar
                loadProgressBar.style.width = `0%`; // Reset for next time (if needed)
                updateButtonStates(); // Re-check button state after load
            } catch (error) {
                console.error('Failed to load FFmpeg:', error);
                converterStatus.textContent = 'Error loading converter engine. Please refresh.';
                loadProgressContainer.classList.add('hidden'); // Hide on error too
            }
        }

        /**
         * Handles file selection (drag/drop or click)
         */
        function handleFileSelect(event) {
            event.preventDefault();
            dropzone.classList.remove('dropzone-active');
            if (isProcessing) return;

            const files = event.dataTransfer ? event.dataTransfer.files : event.target.files;
            
            for (const file of files) {
                if (file.type === 'image/gif') {
                    const fileId = `file-${Date.now()}-${Math.random().toString(36).substring(2, 9)}`;
                    const fileInfo = {
                        id: fileId,
                        file: file,
                        status: 'queued', // 'queued', 'processing', 'converted', 'error'
                        original: {
                            name: file.name,
                            format: 'image/gif',
                            size: file.size,
                            resolution: 'Loading...'
                        },
                        converted: {}
                    };
                    fileQueue.push(fileInfo);
                    addFileToDOM(fileInfo);
                }
            }
            
            // Asynchronously get resolution for each new file
            updateResolutions();
            updateButtonStates();
        }

        /**
         * Creates and adds the HTML for a file item to the list
         */
        function addFileToDOM(fileInfo) {
            const fileItem = document.createElement('div');
            fileItem.id = fileInfo.id;
            fileItem.className = 'bg-gray-800 p-4 rounded-lg shadow-md flex flex-col md:flex-row items-center gap-4';
            
            fileItem.innerHTML = `
                <!-- Status Indicator -->
                <div class="w-full md:w-1/6 text-center md:text-left">
                    <span id="status-${fileInfo.id}" class="font-bold text-yellow-400">Queued</span>
                    <!-- Conversion Progress Bar -->
                    <div id="convert-progress-container-${fileInfo.id}" class="w-full bg-gray-700 rounded-full h-1.5 mt-1 hidden">
                        <div id="convert-progress-bar-${fileInfo.id}" class="bg-blue-600 h-1.5 rounded-full" style="width: 0%"></div>
                    </div>
                </div>
                
                <!-- Original File Info -->
                <div class="w-full md:w-2/6">
                    <p class="font-medium text-white truncate" title="${fileInfo.original.name}">${fileInfo.original.name}</p>
                    <div class="text-sm text-gray-400 flex gap-4">
                        <span>${fileInfo.original.format}</span>
                        <span id="size-${fileInfo.id}">${formatBytes(fileInfo.original.size)}</span>
                        <span id="res-${fileInfo.id}">${fileInfo.original.resolution}</span>
                    </div>
                </div>
                
                <!-- Converted File Info -->
                <div id="converted-info-${fileInfo.id}" class="w-full md:w-2/6 text-sm text-gray-400">
                    <!-- Converted info will go here -->
                </div>
                
                <!-- Action / Download -->
                <div id="action-${fileInfo.id}" class="w-full md:w-1/6 text-center md:text-right">
                    <!-- Download button will go here -->
                </div>
            `;
            fileList.appendChild(fileItem);
        }

        /**
         * Asynchronously gets the resolution for all queued files
         */
        async function updateResolutions() {
            for (const fileInfo of fileQueue) {
                if (fileInfo.original.resolution === 'Loading...') {
                    try {
                        const res = await getGifResolution(fileInfo.file);
                        fileInfo.original.resolution = `${res.width} x ${res.height}`;
                        const resEl = document.getElementById(`res-${fileInfo.id}`);
                        if (resEl) resEl.textContent = fileInfo.original.resolution;
                    } catch (error) {
                        console.error('Could not get resolution:', error);
                        fileInfo.original.resolution = 'Unknown';
                        const resEl = document.getElementById(`res-${fileInfo.id}`);
                        if (resEl) resEl.textContent = 'Unknown';
                    }
                }
            }
        }
        
        /**
         * Helper to get resolution from a File object
         */
        function getGifResolution(file) {
            return new Promise((resolve, reject) => {
                const img = new Image();
                const url = URL.createObjectURL(file);
                img.onload = () => {
                    resolve({ width: img.width, height: img.height });
                    URL.revokeObjectURL(url);
                };
                img.onerror = (err) => {
                    reject(err);
                    URL.revokeObjectURL(url);
                };
                img.src = url;
            });
        }
        
        /**
         * Starts processing the file queue sequentially
         */
        async function startQueue() {
            if (!ffmpeg || !ffmpeg.loaded) {
                converterStatus.textContent = 'Converter is not loaded yet. Please wait.';
                return;
            }
            if (isProcessing) return;

            isProcessing = true;
            updateButtonStates();

            for (const fileInfo of fileQueue) {
                if (fileInfo.status === 'queued') {
                    await processFile(fileInfo);
                }
            }

            isProcessing = false;
            updateButtonStates();
            converterStatus.textContent = 'Conversion queue finished.';
        }

        /**
         * Processes a single file using FFmpeg
         */
        async function processFile(fileInfo) {
            updateFileStatus(fileInfo.id, 'Processing...', 'text-blue-400 status-processing');

            // Show and reset progress bar
            const progressContainer = document.getElementById(`convert-progress-container-${fileInfo.id}`);
            const progressBar = document.getElementById(`convert-progress-bar-${fileInfo.id}`);
            if (progressContainer) progressContainer.classList.remove('hidden');
            if (progressBar) progressBar.style.width = '0%';

            // Set up progress listener
            const progressListener = ({ progress }) => {
                if (progressBar) {
                    // progress is a value from 0 to 1
                    progressBar.style.width = `${Math.min(progress * 100, 100).toFixed(0)}%`;
                }
            };
            ffmpeg.on('progress', progressListener);

            try {
                const inputFileName = fileInfo.file.name;
                const outputFileName = 'output.webp';
                
                // 1. Write the file to FFmpeg's virtual file system
                const data = await fetchFile(fileInfo.file);
                await ffmpeg.writeFile(inputFileName, data);
                
                // 2. Run the FFmpeg command
                // -i: input file
                // -c:v libwebp: use the WebP codec
                // -lossless 1: Use lossless compression (like GIF)
                // -q:v 100: Set quality to 100 (max)
                // -loop 0: Loop infinitely (standard for animated WebP)
                await ffmpeg.exec(['-i', inputFileName, '-c:v', 'libwebp', '-lossless', '1', '-q:v', '100', '-loop', '0', outputFileName]);
                
                // 3. Read the converted file back
                const outputData = await ffmpeg.readFile(outputFileName);
                
                // 4. Clean up virtual file system
                await ffmpeg.deleteFile(inputFileName);
                await ffmpeg.deleteFile(outputFileName);

                // 5. Create blob and download link
                const blob = new Blob([outputData.buffer], { type: 'image/webp' });
                const downloadUrl = URL.createObjectURL(blob);
                
                // 6. Update file info object
                const reduction = 100 - (blob.size / fileInfo.original.size) * 100;
                fileInfo.status = 'converted';
                fileInfo.converted = {
                    format: 'image/webp',
                    size: blob.size,
                    reduction: reduction.toFixed(1),
                    resolution: fileInfo.original.resolution,
                    downloadUrl: downloadUrl,
                    downloadName: fileInfo.original.name.replace(/\.gif$/i, '.webp')
                };

                // 7. Update UI
                updateFileStatus(fileInfo.id, 'Converted', 'text-green-400', false);
                updateConvertedInfo(fileInfo);

            } catch (error) {
                console.error(`Failed to process ${fileInfo.original.name}:`, error);
                updateFileStatus(fileInfo.id, 'Error', 'text-red-500', false);
                const convertedInfoEl = document.getElementById(`converted-info-${fileInfo.id}`);
                if (convertedInfoEl) convertedInfoEl.textContent = 'Conversion failed.';
            } finally {
                // Clean up listener and hide progress bar
                ffmpeg.off('progress', progressListener);
                if (progressContainer) progressContainer.classList.add('hidden');
                if (progressBar) progressBar.style.width = '0%';
            }
        }

        // --- UI Update Functions ---
        
        function updateFileStatus(id, text, cssClass, isProcessing = true) {
            const statusEl = document.getElementById(`status-${id}`);
            if (statusEl) {
                statusEl.textContent = text;
                statusEl.className = `font-bold ${cssClass}`;
                if (isProcessing) {
                    statusEl.classList.add('status-processing');
                } else {
                    statusEl.classList.remove('status-processing');
                }
            }
        }
        
        function updateConvertedInfo(fileInfo) {
            const infoEl = document.getElementById(`converted-info-${fileInfo.id}`);
            const actionEl = document.getElementById(`action-${fileInfo.id}`);
            
            if (infoEl) {
                infoEl.innerHTML = `
                    <div class="text-sm text-gray-300 flex gap-4">
                        <span class="font-medium">image/webp</span>
                        <span class="font-medium">${formatBytes(fileInfo.converted.size)}</span>
                        <span class="font-bold text-green-400">${fileInfo.converted.reduction}% smaller</span>
                    </div>
                `;
            }
            
            if (actionEl) {
                actionEl.innerHTML = `
                    <a href="${fileInfo.converted.downloadUrl}" download="${fileInfo.converted.downloadName}" class="bg-green-600 text-white font-semibold py-2 px-4 rounded-lg text-sm hover:bg-green-700 transition-all">
                        Download
                    </a>
                `;
            }
        }
        
        function updateButtonStates() {
            const hasFiles = fileQueue.length > 0;
            const hasQueuedFiles = fileQueue.some(f => f.status === 'queued');

            if (isProcessing) {
                startButton.disabled = true;
                clearButton.disabled = true;
                dropzone.classList.add('opacity-50', 'cursor-not-allowed');
            } else {
                startButton.disabled = !hasQueuedFiles || !ffmpeg || !ffmpeg.loaded;
                clearButton.disabled = !hasFiles;
                dropzone.classList.remove('opacity-50', 'cursor-not-allowed');
            }
        }

        function clearQueue() {
            if (isProcessing) return;
            
            // Revoke any existing object URLs to prevent memory leaks
            fileQueue.forEach(f => {
                if (f.converted.downloadUrl) {
                    URL.revokeObjectURL(f.converted.downloadUrl);
                }
            });
            
            fileQueue = [];
            fileList.innerHTML = '';
            converterStatus.textContent = 'Converter ready. Please add files.';
            updateButtonStates();
        }

        // --- Utility Functions ---

        /**
         * Formats bytes into a human-readable string (KB, MB)
         */
        function formatBytes(bytes, decimals = 2) {
            if (bytes === 0) return '0 Bytes';
            const k = 1024;
            const dm = decimals < 0 ? 0 : decimals;
            const sizes = ['Bytes', 'KB', 'MB', 'GB'];
            const i = Math.floor(Math.log(bytes) / Math.log(k));
            return parseFloat((bytes / Math.pow(k, i)).toFixed(dm)) + ' ' + sizes[i];
        }

        // --- Event Listeners ---

        // Dropzone events
        ['dragenter', 'dragover', 'dragleave', 'drop'].forEach(eventName => {
            dropzone.addEventListener(eventName, e => e.preventDefault(), false);
            document.body.addEventListener(eventName, e => e.preventDefault(), false); // Prevent browser from opening file
        });
        ['dragenter', 'dragover'].forEach(eventName => {
            dropzone.addEventListener(eventName, () => dropzone.classList.add('dropzone-active'), false);
        });
        ['dragleave', 'drop'].forEach(eventName => {
            dropzone.addEventListener(eventName, () => dropzone.classList.remove('dropzone-active'), false);
        });
        dropzone.addEventListener('drop', handleFileSelect, false);

        // Click to select files
        dropzone.addEventListener('click', () => fileInput.click());
        fileInput.addEventListener('change', handleFileSelect);
        
        // Button events
        startButton.addEventListener('click', startQueue);
        clearButton.addEventListener('click', clearQueue);
        
        // --- Initial Load ---
        loadFFmpeg();

    </script>
</body>
</html>
