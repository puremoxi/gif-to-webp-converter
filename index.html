<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>GIF → WebP Converter</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/@ffmpeg/ffmpeg@0.12.10/dist/umd/ffmpeg.js"></script>
  <script src="https://unpkg.com/@ffmpeg/util@0.12.1/dist/umd/util.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>
  <style>
    body { font-family: ui-sans-serif, system-ui, -apple-system, "Inter", "Segoe UI", Roboto, "Helvetica Neue", Arial; }
    .card { background:#0f172a; border:1px solid #1f2937; border-radius:12px; padding:12px 14px; }
    .hint { color:#94a3b8; font-size:0.9rem; }
    .dropzone-active { border-color:#2563eb; background:#0b1220; }
  </style>
</head>
<body class="bg-gray-900 text-gray-200 min-h-screen p-4 md:p-8">
  <div class="max-w-5xl mx-auto">
    <header class="text-center mb-6">
      <h1 class="text-3xl md:text-4xl font-bold text-white mb-2">GIF → WebP Converter</h1>
      <p class="text-gray-400">Convert animated GIFs to high‑quality WebP locally. Private & fast.</p>
    </header>
    <div id="ffmpeg-banner" style="display:none; max-width:94%; width:720px; margin:0 auto 12px; background:#0b1220; border:1px solid #334155; color:#e2e8f0; border-radius:10px; padding:10px 12px; display:flex; align-items:flex-start; gap:10px;">
      <div style="font-size:18px; line-height:1;">⚙️</div>
      <div style="flex:1;">
        <div id="ffmpeg-banner-text" style="font-weight:600; margin-bottom:4px;">Downloading converter engine…</div>
        <div style="font-size:14px; color:#94a3b8; margin-bottom:8px;">This happens only on first run. The engine is cached, so future loads are fast.</div>
        <div id="ffmpeg-banner-progress" style="height:8px; background:#111827; border:1px solid #1f2937; border-radius:8px; overflow:hidden; display:none;">
          <div id="ffmpeg-banner-progress-bar" style="height:8px; width:0%; background:#3b82f6;"></div>
        </div>
      </div>
      <button id="ffmpeg-banner-close" aria-label="Close" title="Dismiss" style="background:transparent; color:#94a3b8; border:none; font-size:18px; cursor:pointer;">×</button>
    </div>
    <div id="dropzone" class="border-4 border-dashed border-gray-700 rounded-lg p-8 md:p-12 text-center cursor-pointer transition-all duration-300 hover:border-gray-500 mb-4">
      <input type="file" id="fileInput" multiple accept="image/gif" class="hidden">
      <svg class="w-14 h-14 mx-auto text-gray-500 mb-3" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" d="M3 16.5v2.25A2.25 2.25 0 005.25 21h13.5A2.25 2.25 0 0021 18.75V16.5m-13.5-9L12 3m0 0l4.5 4.5M12 3v13.5" />
      </svg>
      <p class="text-xl font-medium text-white">Drag & drop your .gif files here</p>
      <p class="text-gray-400">or click to select files</p>
      <p id="converter-status" class="mt-3 text-yellow-400 font-medium"></p>
    </div>
    <div class="flex flex-col sm:flex-row justify-center gap-4 my-4">
      <button id="start-button" disabled class="bg-blue-600 text-white font-semibold py-3 px-6 rounded-lg shadow-md hover:bg-blue-700 transition-all duration-200 disabled:opacity-50 disabled:cursor-not-allowed">Start Conversion</button>
      <button id="clear-button" class="bg-gray-700 text-gray-300 font-semibold py-3 px-6 rounded-lg hover:bg-gray-600 transition-all duration-200">Clear Queue</button>
      <button id="download-all" disabled class="bg-emerald-600 text-white font-semibold py-3 px-6 rounded-lg hover:bg-emerald-700 transition-all duration-200 disabled:opacity-50">Download ZIP</button>
    </div>
    <div id="settings-panel" class="mb-4">
      <details>
        <summary class="cursor-pointer font-semibold">Advanced</summary>
        <div class="mt-3 flex flex-col gap-3">
          <label for="quality" title="0..100 where higher = better quality (larger files). Ignored if Lossless is enabled.">
            WebP Quality<br/>
            <input id="quality" type="range" min="0" max="100" value="90" />
            <span id="quality-value">90</span>
            <div class="hint">Lossless ignores the quality slider.</div>
          </label>
          <label for="compression-level" title="Sets -compression_level (0..6). 6 = best compression (smallest) but slowest.">
            Compression Level<br/>
            <input id="compression-level" type="range" min="0" max="6" value="6" />
            <span id="compression-level-value">6</span>
            <div class="hint">0 (fastest) -> 6 (best compression)</div>
          </label>
          <div style="height:1px; background:#334155; margin:6px 0;"></div>
          <label title="When checked, uses -loop 0 (infinite). Uncheck for -loop -1 (no loop)."><input type="checkbox" id="loop-toggle" checked /> Loop Animation</label>
          <label title="Optimizes for still images via -preset picture."><input type="checkbox" id="still-toggle" /> Still Image</label>
          <label title="Lossless WebP uses -lossless 1; quality slider is ignored."><input type="checkbox" id="lossless-toggle" /> Lossless Compression</label>
          <label title="Experimental: per-frame lossy/lossless mixing when tools are available; otherwise best-of-two fallback."><input type="checkbox" id="mixed-toggle" /> Mixed Compression</label>
          <div class="flex flex-col gap-2 pl-1">
            <label for="mixed-mode">Mixed Tuning Mode<br/>
              <select id="mixed-mode" style="background:#334155; color:#ffffff; border:1px solid #475569; border-radius:8px; padding:6px 8px;">
                <option value="percent" selected>Percent (top X% most-detailed)</option>
                <option value="threshold">Edge Score Threshold (percentile)</option>
              </select>
            </label>
            <label for="mixed-percent">Lossless Percentage<br/>
              <input id="mixed-percent" type="range" min="10" max="50" value="20" />
              <span id="mixed-percent-value">20%</span>
              <div class="hint">Top X% of frames by edge detail will be lossless.</div>
            </label>
            <label for="mixed-threshold">Edge Threshold (percentile)<br/>
              <input id="mixed-threshold" type="range" min="50" max="99" value="80" />
              <span id="mixed-threshold-value">80th</span>
              <div class="hint">Lossless for frames at/above this edge-score percentile.</div>
            </label>
          </div>
          <div class="mt-2"><button id="reset-settings" class="bg-slate-700 hover:bg-slate-600 rounded px-3 py-2 text-sm">Reset to Defaults</button></div>
        </div>
      </details>
    </div>
    <div id="results" class="space-y-3"></div>
  </div>
  <script type="module" src="./src/app.js"></script>
</body>
</html>
