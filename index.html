<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Image → WebP Converter (FFmpeg MT)</title>
  <link rel="stylesheet" href="/vendor/css/tailwind.css" />
</head>
<body class="bg-gray-900 text-gray-200 min-h-screen p-4 md:p-8">
  <div class="max-w-5xl mx-auto">
    <header class="text-center mb-6">
      <h1 class="text-3xl md:text-4xl font-bold text-white mb-2">Image → WebP Converter</h1>
      <p class="text-gray-400">Please refer to README for proper installation of this tool.</p>
      <p class="text-gray-400">All files processed on local machine.</p>
      <p class="text-gray-400">Multi-threaded FFmpeg WASM (core-mt). Place UMD files in <code>vendor/ffmpeg/</code>.</p>
    </header>

    <div id="dropzone" class="relative border-4 border-dashed border-gray-700 rounded-lg p-8 md:p-12 text-center transition-all duration-300 hover:border-gray-500 mb-2">
      <input type="file" id="fileInput" multiple accept="image/gif,image/png,image/jpeg" class="absolute inset-0 w-full h-full opacity-0 cursor-pointer" aria-label="Choose image files"/>
      <div class="pointer-events-none select-none">
        <p class="text-xl font-medium text-white">Drag & drop your .gif, .png, or .jpg files here</p>
        <p class="text-gray-400">or click to select files</p>
        <p id="converter-status" class="mt-3 text-yellow-400 font-medium"></p>
      </div>
    </div>

    <div id="batch-time" class="max-w-3xl mx-auto mb-4 text-sm text-slate-300 text-center"></div>

    <div class="flex flex-col sm:flex-row justify-center gap-4 my-4">
      <button id="start-button" disabled class="bg-blue-600 text-white font-semibold py-3 px-6 rounded-lg shadow-md hover:bg-blue-700 transition-all duration-200 disabled:opacity-50 disabled:cursor-not-allowed">Start Conversion</button>
      <button id="clear-button" class="bg-gray-700 text-gray-300 font-semibold py-3 px-6 rounded-lg hover:bg-gray-600 transition-all duration-200">Clear Queue</button>
      <button id="download-all" disabled class="bg-emerald-600 text-white font-semibold py-3 px-6 rounded-lg hover:bg-emerald-700 transition-all duration-200 disabled:opacity-50">Download ALL</button>
    </div>

    <section id="advanced" class="mb-4">
      <button id="advanced-toggle"
              class="w-full text-left font-semibold py-2 px-3 rounded-lg bg-slate-700/70 border border-slate-600 hover:bg-slate-700 transition"
              aria-expanded="false"
              aria-controls="advanced-body">
        Advanced
      </button>
      <div id="advanced-body" class="mt-3" hidden>
        <div class="mt-3 flex flex-col gap-3">
          <label class="space-y-1">
            <div>WebP Quality</div>
            <input id="quality" type="range" min="0" max="100" value="90" class="w-full"/>
            <div class="flex items-center gap-2 text-sm text-slate-300">
              <span id="quality-value" class="font-semibold">90</span>
              <span class="text-slate-400">Lossless ignores the quality slider.</span>
            </div>
          </label>
          <label class="space-y-1">
            <div>Compression Level</div>
            <input id="compression-level" type="range" min="0" max="6" value="6" class="w-full"/>
            <div class="flex items-center gap-2 text-sm text-slate-300">
              <span id="compression-level-value" class="font-semibold">6</span>
              <span class="text-slate-400">0 (fastest) → 6 (best compression)</span>
            </div>
          </label>
          <div class="h-px bg-slate-500/60"></div>
          <label class="inline-flex items-center gap-2"><input type="checkbox" id="resize-toggle"/> Resize Down (Proportional)</label>
          <label class="space-y-1">
            <div>Max Width (px)</div>
            <input id="resize-width" type="number" min="1" step="1" value="1200" disabled class="w-full rounded-lg bg-slate-800 border border-slate-600 px-3 py-2 disabled:opacity-50"/>
            <div class="text-sm text-slate-400">Only downsizes when source width is larger than this value. Never upsizes.</div>
          </label>
          <div class="h-px bg-slate-500/60"></div>
          <label class="inline-flex items-center gap-2"><input type="checkbox" id="loop-toggle" checked/> Loop Animation</label>
          <label class="inline-flex items-center gap-2"><input type="checkbox" id="still-toggle"/> Still Image</label>
          <label class="inline-flex items-center gap-2"><input type="checkbox" id="lossless-toggle"/> Lossless Compression</label>
          <label class="inline-flex items-center gap-2"><input type="checkbox" id="mixed-toggle"/> Mixed Compression</label>
        </div>
      </div>
    </section>

    <section id="processing-queue" class="mb-4">
      <button id="processing-queue-toggle"
              class="w-full text-left font-semibold py-2 px-3 rounded-lg bg-slate-700/70 border border-slate-600 hover:bg-slate-700 transition"
              aria-expanded="true"
              aria-controls="processing-queue-body">
        Processing Queue
      </button>
      <div id="processing-queue-body" class="mt-3">
        <div id="aggregate-time" class="text-sm text-slate-300 mb-2 text-center"></div>
        <div id="results" class="space-y-3"></div>
      </div>
    </section>
  </div>

  <script src="/vendor/ffmpeg/ffmpeg.js"></script>
  <script src="/src/boot.js"></script>
  <script type="module" src="/src/ui-extensions.js"></script>
  <script type="module" src="/src/app.js"></script>
</body>
</html>
